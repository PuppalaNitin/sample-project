# src/test/resources/application-test.properties

# Disable SQL scripts during tests
spring.sql.init.mode=never

# Auto-create/drop schema for tests
spring.jpa.hibernate.ddl-auto=create-drop

# Test database (can use H2 for true unit tests)
spring.datasource.url=jdbc:mysql://localhost:3306/fraud_detection_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=80744
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Reduce test noise
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN