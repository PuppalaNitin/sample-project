# ============================================
# Fraud Detection Rule Engine - Configuration
# ============================================

# Application
spring.application.name=fraud-detection-engine
server.port=8080

# ============================================
# Database - MySQL
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/fraud_detection_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=80744
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate
# ============================================
# 'none' = Hibernate will NOT create tables. schema.sql will create them instead.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================
# SQL Initialization - AUTO-RUN schema.sql & data.sql ON STARTUP
# ============================================
# 'always' = Run SQL scripts every time app starts (development)
# 'never'  = Don't run automatically (production)
# 'embedded' = Only run for H2/embedded databases
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ============================================
# Connection Pool (HikariCP)
# ============================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ============================================
# Logging
# ============================================
logging.level.com.fraud.engine=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# Fraud Engine Configuration
# ============================================
fraud.engine.high-value-threshold=50000.00
fraud.engine.frequent-transaction-window-minutes=10
fraud.engine.frequent-transaction-threshold=5
fraud.engine.geo-anomaly-enabled=true
fraud.engine.repeated-failure-threshold=3
fraud.engine.repeated-failure-window-minutes=30

# Idempotency
fraud.engine.idempotency.ttl-hours=24